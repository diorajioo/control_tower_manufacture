# TEMPLATE — the keys of the staging Secret. The infra team creates it in the cluster; never commit
# a filled-in copy (k8s/secret.yaml is git-ignored).
#   kubectl apply -n ct-manufaktur -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: control-tower-manufacture-staging-secrets
  namespace: ct-manufaktur
type: Opaque
stringData:
  # ClickHouse (internal) — the data source on Kubernetes (DATA_SOURCE=clickhouse in the ConfigMap)
  CLICKHOUSE_URL: ""
  CLICKHOUSE_USER: ""
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_DB_CONTROL_TOWER: ""
  CLICKHOUSE_DB_DATAMART: ""
  # Azure AD App Registration (redirect URI: https://poros-staging.paradev.io/ct-manuf/api/auth/callback/azure-ad)
  AZURE_AD_CLIENT_ID: ""
  AZURE_AD_TENANT_ID: ""
  AZURE_AD_CLIENT_SECRET: ""
  # NextAuth — generate: openssl rand -base64 32. Its own value, NOT production's (Vercel).
  NEXTAUTH_SECRET: ""
  # AI
  DEEPSEEK_API_KEY: ""
  GROQ_API_KEY: ""
  # /api/cron/notifications bearer — generate: openssl rand -hex 32 (no CronJob on staging yet)
  CRON_SECRET: ""
  # Teams (ConfigMap holds TEAMS_RECIPIENTS + TEAMS_USE_APP_TOKEN). Each is optional:
  #   TEAMS_REFRESH_TOKEN — delegated refresh token of the sending account, used when no sender is
  #     connected in Settings → Teams → Sender (needs Chat.Create + ChatMessage.Send)
  #   TEAMS_WEBHOOK_URL   — Power Automate / incoming webhook, last fallback
  #   NOTIF_STORE_KEY     — encrypts the connected sender's refresh token; defaults to NEXTAUTH_SECRET
  TEAMS_REFRESH_TOKEN: ""
  TEAMS_WEBHOOK_URL: ""
  NOTIF_STORE_KEY: ""
