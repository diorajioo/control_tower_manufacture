# TEMPLATE — copy to secret.yaml, fill in, apply. Never commit secret.yaml (it is in .gitignore).
#   kubectl apply -n control-tower -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: control-tower
type: Opaque
stringData:
  # ClickHouse (internal, 10.3.181.118) — the data source on Kubernetes
  CLICKHOUSE_URL: ""
  CLICKHOUSE_USER: ""
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_DB_CONTROL_TOWER: ""
  CLICKHOUSE_DB_DATAMART: ""
  # Snowflake — only as fallback until snowflake-sdk is removed (see k8s/README.md)
  SNOWFLAKE_ACCOUNT: ""
  SNOWFLAKE_USERNAME: ""
  SNOWFLAKE_PASSWORD: ""
  SNOWFLAKE_DATABASE: ""
  SNOWFLAKE_WAREHOUSE: ""
  SNOWFLAKE_SCHEMA: ""
  # Azure AD App Registration
  AZURE_AD_CLIENT_ID: ""
  AZURE_AD_CLIENT_SECRET: ""
  AZURE_AD_TENANT_ID: ""
  # NextAuth — generate: openssl rand -base64 32 (keep the Vercel value to keep the Teams sender connected)
  NEXTAUTH_SECRET: ""
  # AI
  DEEPSEEK_API_KEY: ""
  GROQ_API_KEY: ""
  # Scheduled notifications — generate: openssl rand -hex 32
  CRON_SECRET: ""
  # Optional
  RESEND_API_KEY: ""
